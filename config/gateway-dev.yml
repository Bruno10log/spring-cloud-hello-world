server: 
    port: 8080

spring:
    application:
        name: gateway

    cloud:
        gateway:
            server:
                webmvc:
                    routes:
                        - id: customer-service
                          uri: lb://customer-service
                          predicates:
                            - Path=/api/users/**
                          filters:
                            - name: CircuitBreaker
                              args:
                                id: customerServiceCB
                                fallbackUri: forward:/fallback/customer-service

                        - id: order-service
                          uri: lb://order-service
                          predicates:
                            - Path=/api/orders/**
                          filters:
                            - name: CircuitBreaker
                              args:
                                id: orderServiceCB
                                fallbackUri: forward:/fallback/order-service