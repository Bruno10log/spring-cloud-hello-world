server:
    port: 8888

spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: https://github.com/Bruno10log/spring-cloud-hello-world
          search-paths: config
          default-label: develop
          clone-on-start: true
          force-pull: true

eureka:
    client:
        service-url:
         defaultZone: http://localhost:8761/eureka/

management:
    endpoints:
        web:
            exposure:
                include: "*"
    endpoint:
        health:
            show-details: always
